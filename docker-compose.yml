# ──────────────────────────────────────────────────────────────────────
# Self-Healing MLOps Agent — Docker Compose
#
# 실행 방법:
#   cp .env.example .env        # 토큰/URL 값 채우기
#   docker compose up -d        # 전체 스택 실행
#   docker compose logs -f agent  # 에이전트 로그 확인
#
# 서비스 포트:
#   대시보드      → http://localhost:8501
#   승인 서버     → http://localhost:8000
#   Ollama LLM   → http://localhost:11434  (ollama 프로파일 활성화 시)
# ──────────────────────────────────────────────────────────────────────

services:

  # ── 1. 로그 워처 (메인 에이전트) ──────────────────────────────────────
  agent:
    build: .
    container_name: mlops_agent
    command: python -m src.log_watcher /app/data/realtime_system.log
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434   # Compose 내부 네트워크 주소
    volumes:
      - ./data:/app/data                      # SQLite DB, 로그 파일 공유
    depends_on:
      - approval-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import src.llm_engine"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 2. 대시보드 (Streamlit) ───────────────────────────────────────────
  dashboard:
    build: .
    container_name: mlops_dashboard
    command: >
      streamlit run dashboard/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # ── 3. Human-in-the-Loop 승인 서버 (FastAPI) ─────────────────────────
  approval-server:
    build: .
    container_name: mlops_approval
    command: uvicorn src.approval_server:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── 4. Ollama LLM 서버 (선택 — L2 추론 필요 시만 활성화) ──────────────
  # 활성화: docker compose --profile llm up -d
  ollama:
    image: ollama/ollama:latest
    container_name: mlops_ollama
    profiles: ["llm"]       # 기본 실행에서는 제외; --profile llm 으로 활성화
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama_models:
    name: mlops_ollama_models    # 컨테이너 재생성 시에도 모델 유지
