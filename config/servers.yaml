# 서버 목록 설정 (2026-09-06 추가)
#
# 지금은 서버가 1대뿐이지만, Phase 3 k8s 연동 전에 구조만 미리 리스트화해둔다
# (9/3 /grill-me 세션 결정). 서버가 여러 대가 돼도 이 파일 구조 자체는 안 바뀌고
# servers 리스트에 항목만 추가하면 되도록 설계.
#
# exec_method: 이 서버에서 복구 명령을 어떤 방식으로 실행하는지 (systemd/k8s).
#   서버마다 같은 "고치는 방법"도 실행 메커니즘이 다를 수 있어서 예약해둔 필드.
#   2026-09-09부터 src/executor.py가 이 값을 실제로 분기 처리함
#   (RESTART_SERVICE/KILL_PROCESS 두 액션만; k8s_namespace는 exec_method: k8s 전용).
#   TARGET_SERVER 환경변수로 어떤 서버를 쓸지 선택 — 미설정 시 목록의 첫 서버(gcp-primary).
#
# 에러 카테고리 → 복구 액션 매핑은 여기 안 두고 코드(src/llm_engine.py 등)에
# 그대로 유지한다 — 그건 서버 다중화와는 다른 축의 관심사.
#
# k8s_target_app: exec_method: k8s 전용. L1 캐시/LLM이 만든 target_process가
#   None이거나(예: Memory_Leak 카테고리) 실제 리소스명과 안 맞는 범용 placeholder일
#   때(예: Process_Crash 카테고리의 "pod") 대체할, 이 서버가 실제로 관리하는 단일
#   Deployment 이름. src/executor.py의 _resolve_k8s_target_name()이 실제 존재
#   여부를 확인한 뒤에만 폴백한다 — 2026-09-10 로컬 실측으로 필요성 확인됨.
#
# docker_target_app: exec_method: systemd 전용. target-app이 systemd 유닛이
#   아니라 docker-compose 컨테이너라서, target_process가 실제 systemd 유닛이
#   아니면(예: "rsyslog" — 실존하지만 무관한 서비스를 조용히 재시작함) systemctl
#   대신 이 컨테이너 이름으로 docker restart/kill을 쓴다. k8s_target_app과 동일한
#   역할 — 2026-09-10 VM 실측(AUTO 승급된 Process_Crash가 rsyslog를 잘못 재시작)
#   으로 필요성 확인됨.

servers:
  - name: gcp-primary
    log_path: ./data/realtime_system.log
    target_app_url: http://localhost:9000
    exec_method: systemd
    docker_target_app: mlops_target_app

  # Phase 3 k8s 연동 로컬 검증용 (2026-09-09 추가). minikube 세팅은
  # deploy/k8s/target-app-deployment.yaml 참고. VM(gcp-primary)엔 영향 없음
  # — TARGET_SERVER=local-minikube로 명시적으로 선택해야만 이 서버가 쓰임.
  - name: local-minikube
    log_path: ./data/realtime_system.log
    target_app_url: http://localhost:19000
    exec_method: k8s
    k8s_namespace: default
    k8s_target_app: target-app

  # Phase 3 k8s 연동 GCP VM 검증용 (2026-09-09 추가). VM에 k3s(경량 프로덕션급
  # k8s 배포판, minikube는 VM 자원 대비 오버헤드가 커서 제외 — 상세는
  # project-roadmap-status 메모리 참고) 설치, 기존 docker-compose target-app
  # (gcp-primary가 쓰는 실제 운영 컨테이너, 90일 데이터 수집 중)은 전혀 안 건드리고
  # 별도 파드로 병행 배포. TARGET_SERVER=gcp-k3s로 명시적으로 선택해야만 쓰임.
  - name: gcp-k3s
    log_path: ./data/realtime_system.log
    target_app_url: http://localhost:19100
    exec_method: k8s
    k8s_namespace: default
    k8s_target_app: target-app
